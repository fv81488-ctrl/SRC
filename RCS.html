<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام إدارة النادي – نادي العلوم والأبحاث العلمية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b3a6b;--navy2:#274b86;--gold:#c9a227;--bg:#eef1f7;--ink:#1c2433;--mut:#667089;--line:#dde3ee;--bad:#c0392b;--ok:#1d8a5a}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],input[type=email],select,textarea{width:100%;padding:8px 10px;border:1px solid #b9c2cf;border-radius:8px;background:#fff}
textarea{resize:vertical;line-height:1.8}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid #8fb0e6;outline-offset:1px}
label.fl{display:block;font-weight:700;font-size:14px;margin:9px 0 3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:560px){.g2,.g3{grid-template-columns:1fr}}
button{border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
.b-pri{background:var(--navy);color:#fff}.b-pri:hover{background:var(--navy2)}
.b-gold{background:var(--gold);color:#1b2a4a}
.b-gh{background:#fff;border:1px solid var(--navy);color:var(--navy)}
.b-dg{background:#fff;border:1px solid var(--bad);color:var(--bad)}
.sm{padding:3px 10px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tip{font-size:12.5px;color:var(--mut)}
.chkr{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;margin:6px 0}
.chkr input{width:18px;height:18px;accent-color:var(--navy)}

/* الهيكل */
.hdr{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold);position:sticky;top:0;z-index:20}
.hdr-in{display:flex;align-items:center;gap:10px;padding:8px 14px}
.hdr img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:50%;padding:2px}
.hdr b{display:block;font-size:16px;line-height:1.3}.hdr small{color:#ecdca0}
.hdr .sp1{flex:1}
.hdr button{background:rgba(255,255,255,.12);color:#fff}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 60px)}
.nav{background:#fff;border-left:1px solid var(--line);padding:10px 8px;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto}
.nav button{display:block;width:100%;text-align:right;background:none;color:var(--ink);padding:10px 12px;margin-bottom:3px;border-radius:8px}
.nav button:hover{background:#eef2f8}
.nav button.on{background:var(--navy);color:#fff}
.page{padding:14px;min-width:0}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .nav{position:fixed;bottom:0;top:auto;right:0;left:0;height:auto;display:flex;overflow-x:auto;gap:2px;border-left:0;border-top:1px solid var(--line);z-index:30;padding:4px}
  .nav button{white-space:nowrap;width:auto;margin:0;padding:8px 12px}
  .page{padding-bottom:80px}
}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.box h2{margin:0 0 8px;font-size:17px;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;border-top:4px solid var(--gold)}
.stat b{display:block;font-size:26px;color:var(--navy);line-height:1.2}
.tw{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th,table.tb td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
table.tb th{background:#eef2f8;color:var(--navy);white-space:nowrap}
table.tb img.av{width:34px;height:44px;object-fit:cover;border-radius:4px;background:#eef2f8}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12.5px;font-weight:700;background:#eef2f8}
.tg-ok{background:#eaf7f0;color:#1d8a5a}.tg-bd{background:#fdeceb;color:#c0392b}.tg-wr{background:#fdf5e4;color:#b7791f}
.empty{color:var(--mut);text-align:center;padding:18px}
.split{display:grid;grid-template-columns:430px minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:1100px){.split{grid-template-columns:1fr}}
.ovl{position:fixed;inset:0;background:rgba(20,30,50,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 10px}
.mdl{background:#fff;border-radius:14px;max-width:640px;width:100%;padding:16px;border-top:5px solid var(--gold)}
.mdl h3{margin:0 0 6px;color:var(--navy)}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90}
#toast.on{opacity:1}
.ph-box{display:flex;gap:10px;align-items:flex-start}
.ph-pv{width:90px;height:120px;border:2px dashed #b9c2cf;border-radius:8px;overflow:hidden;background:#eef2f8;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mut);flex:none;text-align:center}
.ph-pv img{width:100%;height:100%;object-fit:cover}
.stg{overflow:hidden}
.login{max-width:430px;margin:40px auto;padding:0 14px}
.login .box{border-top:5px solid var(--gold)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;background:#eef2f8;color:var(--navy)}.tabs button.on{background:var(--navy);color:#fff}
.sc{display:grid;grid-template-columns:1fr 112px;gap:6px;padding:6px;border-bottom:1px solid var(--line);align-items:center}
.sc .nt{grid-column:1/-1}
.sc input[type=text],.sc select{padding:5px 7px;font-size:14px}
.card.sh{box-shadow:0 1px 6px rgba(0,0,0,.25)}
.cvw{display:flex;gap:14px;flex-wrap:wrap}

/* ===== الورقة (A4) ===== */
.paper{width:210mm;min-height:297mm;background:#fff;position:relative;box-shadow:0 2px 14px rgba(0,0,0,.2);color:#111;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;direction:rtl;-webkit-print-color-adjust:exact;print-color-adjust:exact}
table.pg{width:100%;border-collapse:collapse;min-height:297mm}
table.pg>thead{display:table-header-group}table.pg>tfoot{display:table-footer-group}
table.pg td{padding:0;vertical-align:top}
.lh{padding:9mm 20mm 0}
.lh-in{display:flex;align-items:center;gap:6mm;padding-bottom:3mm}
.lh img{width:24mm;height:24mm;object-fit:contain;flex:none}
.lh .nm{flex:1;text-align:center}
.lh .ar{font-size:23pt;font-weight:800;color:#1b3a6b;line-height:1.25}
.lh .en{font-size:10.5pt;font-weight:700;color:#2f5597;letter-spacing:.6pt;direction:ltr}
.lh .un{font-size:11pt;color:#555;margin-top:.5mm}
.lh .sp{width:24mm;flex:none}
.lh .ln{height:1.1mm;background:#c9a227;border-bottom:.5mm solid #1b3a6b;box-sizing:content-box}
table.pg td.bodycell{padding:6mm 22mm 4mm}
.meta{display:flex;justify-content:space-between;font-size:11.5pt;font-weight:700;color:#1b3a6b;margin-bottom:7mm}
.to{font-size:13pt;font-weight:800;color:#1b3a6b;line-height:1.7;margin-bottom:3mm}
.gr{font-size:13pt;font-weight:700;margin-bottom:3mm}
.sj{font-size:13pt;font-weight:800;color:#1b3a6b;margin:2mm 0 5mm;padding:1.5mm 3mm;border-right:1.3mm solid #c9a227;background:#f3f6fb}
.bd{font-size:var(--fs,13pt);line-height:1.95;text-align:justify}
.bd p{margin:0 0 3.2mm}
.bd ul{margin:0 0 3.2mm;padding:0 7mm 0 0}.bd li{margin:0 0 1mm}
.cl{font-size:var(--fs,13pt);line-height:1.9;margin:3mm 0 6mm}
.sig{position:relative;min-height:46mm;break-inside:avoid;page-break-inside:avoid}
.sigbox{position:relative;width:62mm;text-align:center;font-size:12.5pt}
.sigbox.right{margin-right:0;margin-left:auto}.sigbox.left{margin-right:auto;margin-left:0}.sigbox.center{margin:0 auto}
.sigbox .t{font-weight:800;color:#1b3a6b}
.sigbox .n{font-weight:700;margin-top:1mm}
.sigbox .l{margin-top:9mm;border-top:.3mm solid #333;padding-top:.8mm;font-size:10.5pt;color:#555}
.seal{position:absolute;mix-blend-mode:multiply;opacity:.9;transform:rotate(-7deg);pointer-events:none;top:6mm;left:50%;margin-left:-20mm}
.notes{font-size:11pt;line-height:1.8;margin-top:3mm;color:#222}
.notes b{color:#1b3a6b}
.lf{position:absolute;bottom:0;left:0;right:0;padding:0 20mm 6mm;text-align:center;font-size:10.5pt;color:#333}
.lf .ln{height:.9mm;background:#c9a227;margin-bottom:2.5mm}
.lf bdi{direction:ltr;unicode-bidi:isolate;font-weight:700;color:#1b3a6b}
.fsp{height:24mm}
.ph{background:#fff3b0}


.ttl{text-align:center;font-size:17pt;font-weight:800;color:#1b3a6b;margin:1mm 0 4mm}
.info{display:grid;grid-template-columns:1fr 1fr;gap:1.2mm 6mm;border:.3mm solid #c9d3e6;background:#f5f8fd;border-radius:2mm;padding:3mm 4mm;font-size:11.5pt;margin-bottom:4mm}
.info b{color:#1b3a6b}
.info .w{grid-column:1/-1}
table.at{width:100%;border-collapse:collapse;font-size:11.5pt;margin-bottom:4mm}
table.at th{background:#1b3a6b;color:#fff;padding:1.4mm 2mm;border:.3mm solid #1b3a6b;font-weight:700}
table.at td{padding:1.1mm 2mm;border:.3mm solid #8a94a6;vertical-align:middle}
table.at tr{break-inside:avoid;page-break-inside:avoid}
table.at tbody tr:nth-child(even){background:#f6f8fc}
.c{text-align:center}
.st-p{color:#1d8a5a;font-weight:800}.st-l{color:#b7791f;font-weight:800}.st-x{color:#2f5597;font-weight:800}.st-e{color:#c0720b;font-weight:800}.st-a{color:#c0392b;font-weight:800}
.sum{display:flex;gap:2mm;margin-bottom:3mm;break-inside:avoid}
.sum div{flex:1;border:.3mm solid #c9d3e6;border-radius:2mm;text-align:center;padding:1.5mm;font-size:10.5pt;background:#fff}
.sum b{display:block;font-size:15pt;color:#1b3a6b}
.abs{break-inside:avoid;margin-bottom:2mm}
.abs h4{margin:0 0 1.5mm;font-size:12.5pt;color:#1b3a6b;border-right:1.3mm solid #c9a227;padding-right:2.5mm}
.abs ol{margin:0;padding:0 6mm 0 0;font-size:11.5pt;line-height:1.9}
.sigs{display:flex;justify-content:space-between;gap:8mm;margin-top:3mm;break-inside:avoid;page-break-inside:avoid;position:relative;min-height:22mm}
.sg{width:56mm;text-align:center;font-size:11.5pt;position:relative}
.sg .t{font-weight:800;color:#1b3a6b}
.sg .l{margin-top:9mm;border-top:.3mm solid #333;padding-top:.6mm;font-size:10.5pt}
.seal{position:absolute;mix-blend-mode:multiply;opacity:.9;transform:rotate(-7deg);pointer-events:none;top:-3mm;left:50%}
.lf{position:absolute;bottom:0;left:0;right:0;padding:0 20mm 6mm;text-align:center;font-size:10.5pt;color:#333}
.lf .ln{height:.9mm;background:#c9a227;margin-bottom:2.5mm}
.lf bdi{direction:ltr;unicode-bidi:isolate;font-weight:700;color:#1b3a6b}
.fsp{height:20mm}


/* ===== البطاقة (المقاسات بالمليمتر) ===== */
.card{width:85.6mm;height:54mm;border-radius:3.5mm;overflow:hidden;position:relative;direction:rtl;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;line-height:1.25;flex:none;box-shadow:0 1px 6px rgba(0,0,0,.25);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.front{background:linear-gradient(135deg,#1b3a6b 0%,#274b86 100%);color:#fff}
.front .stripe{position:absolute;left:0;right:0;bottom:0;height:1.8mm;background:#c9a227}
.front .hd{position:absolute;top:3mm;right:4mm;left:4mm;display:flex;align-items:center;gap:2.5mm}
.front .lg{width:12mm;height:12mm;border-radius:50%;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.front .lg img{width:11mm;height:11mm;object-fit:contain}
.front .t1{font-size:3.5mm;font-weight:800;color:#fff}
.front .t2{font-size:1.9mm;letter-spacing:.2mm;color:#ecdca0;direction:ltr;text-align:right;font-weight:700}
.front .t3{font-size:2mm;color:#c9d4e8}
.front .sep{position:absolute;top:17mm;right:4mm;left:4mm;height:.35mm;background:rgba(201,162,39,.8)}
.front .ph{position:absolute;left:4mm;top:19.5mm;width:20mm;height:26.5mm;border:.5mm solid #c9a227;border-radius:1.5mm;overflow:hidden;background:#dfe6f2;display:flex;align-items:flex-end;justify-content:center}
.front .ph img{width:100%;height:100%;object-fit:cover;display:block}
.front .ph svg{width:80%;height:80%}
.front .info{position:absolute;right:4mm;top:19mm;width:54mm}
.front .nm{font-weight:800;color:#fff;margin-bottom:.6mm}
.front .rl{font-size:3.2mm;font-weight:800;color:#e6c555}
.front .cm{font-size:2.6mm;color:#dbe4f4;margin-top:.3mm}
.front .kv{font-size:2.4mm;color:#fff;margin-top:1.6mm}
.front .kv span{color:#ecdca0}
.front .kv b{direction:ltr;unicode-bidi:embed;font-weight:800;letter-spacing:.15mm}
.front .vd{position:absolute;right:4mm;bottom:3.4mm;font-size:2.2mm;color:#ecdca0}
.back{background:#fff;color:#1b3a6b;border:.2mm solid #d6dcea}
.back .band{position:absolute;top:0;left:0;right:0;height:7.5mm;background:#1b3a6b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:3.2mm;font-weight:800;border-bottom:.9mm solid #c9a227}
.back .bd{position:absolute;top:10mm;right:5mm;left:5mm;font-size:2.5mm;color:#1c2433}
.back .bd p{margin:0 0 1.4mm}
.back .bd li{margin:0 0 .9mm}
.back ul{margin:0;padding:0 3.5mm 0 0}
.back .ft{position:absolute;bottom:3mm;right:5mm;left:5mm;display:flex;justify-content:space-between;align-items:flex-end;font-size:2.2mm}
.back .sg{text-align:center;color:#1c2433}.back .sg i{display:block;width:26mm;border-top:.25mm solid #1b3a6b;margin-bottom:.6mm}
.back .em{direction:ltr;color:#1b3a6b;font-weight:700}
.back .lgb{width:9mm;height:9mm;object-fit:contain}



#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  .paper{box-shadow:none;min-height:0}
  table.pg{min-height:0}
  .lf{position:fixed}
  .ph{background:none}
  .cardsheet{padding:12mm 10mm}
  .prow{display:flex;flex-direction:row;gap:6mm;margin:0 0 6mm;justify-content:center;break-inside:avoid;page-break-inside:avoid}
  .prow:nth-child(4n){break-after:page;page-break-after:always}
  .card{box-shadow:none;outline:.15mm dashed #888;outline-offset:.4mm}
}
/* ===== اجتماع مباشر ===== */
.mt{position:fixed;inset:0;z-index:100;background:#0b1424;color:#eaf0fa;display:flex;flex-direction:column}
.mt .h{display:none!important}
.mt-hs{margin:auto;max-width:620px;width:calc(100% - 24px);background:#13213a;border:1px solid #27406a;border-top:5px solid var(--gold);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.mt-hs h2{margin:0;font-size:20px}.mt-hs p{margin:0;color:#9db0cf;font-size:14px}
.mt textarea{height:90px;resize:none;direction:ltr;font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#0b1424;color:#eaf0fa;border:1px solid #27406a;word-break:break-all}
.mt-st{display:flex;gap:6px}.mt-st b{flex:1;height:5px;border-radius:9px;background:#27406a}.mt-st b.on{background:var(--gold)}
.mt-top{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid #27406a;flex-wrap:wrap}
.mt-pill{background:#13213a;border:1px solid #27406a;border-radius:99px;padding:2px 14px;font-size:14px;direction:ltr;display:inline-flex;gap:8px;align-items:center}
.mt-dot{width:9px;height:9px;border-radius:50%;background:#2ee6b8}.mt-dot.w{background:#ffb020}
.mt-room{flex:1;display:flex;flex-direction:column;min-height:0}
.mt-main{flex:1;display:flex;min-height:0;position:relative}
.mt-stage{flex:1;position:relative;background:#060b14;min-width:0}
.mt-stage video.rv{width:100%;height:100%;object-fit:contain}
.mt-wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9db0cf}
.mt-me{position:absolute;bottom:14px;left:14px;width:min(30%,230px);aspect-ratio:16/10;border-radius:10px;overflow:hidden;border:2px solid var(--gold);background:#000}
.mt-me video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.mt-chat{width:300px;background:#13213a;border-right:1px solid #27406a;display:flex;flex-direction:column}
.mt-msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.mt-m{max-width:88%;padding:7px 12px;border-radius:12px;background:#27406a;font-size:14px;word-break:break-word}
.mt-m.me2{align-self:flex-end;background:#6b5614}.mt-m small{display:block;color:#b8c6de;font-size:11px}
.mt-send{display:flex;gap:6px;padding:8px;border-top:1px solid #27406a}
.mt-send input{background:#0b1424;color:#eaf0fa;border-color:#27406a}
.mt-bar{display:flex;justify-content:center;gap:8px;padding:10px;border-top:1px solid #27406a;flex-wrap:wrap}
.mt-bar button{background:#13213a;color:#eaf0fa;border:1px solid #27406a;min-width:84px}
.mt-bar button.off{background:#c0392b;border-color:#c0392b}.mt-bar button.on{background:var(--gold);color:#1b2a4a}
.mt-bar button.end{background:#c0392b;border-color:#c0392b}
@media(max-width:700px){.mt-chat{position:absolute;inset:0;width:100%;z-index:3}}

.gm-grid{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;align-content:start;min-width:0}
.gm-t{position:relative;aspect-ratio:16/10;background:#13213a;border-radius:10px;overflow:hidden;border:2px solid transparent;display:flex;align-items:center;justify-content:center}
.gm-t video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gm-t.sp{border-color:var(--gold)}
.gm-t.sc{grid-column:span 2;grid-row:span 2}.gm-t.sc video{object-fit:contain;background:#000}
.gm-i{font-size:34px;color:#9db0cf}
.gm-n{position:absolute;bottom:4px;right:6px;z-index:2;background:#000a;border-radius:6px;padding:0 8px;font-size:12px}
@media(max-width:700px){.gm-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.gm-t.sc{grid-column:span 2}}
.gm-grid.au{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.gm-grid.au .gm-t{aspect-ratio:1;border-radius:50%}.gm-grid.au .gm-i{font-size:40px}.gm-grid.au .gm-n{bottom:14px;right:50%;transform:translateX(50%);white-space:nowrap;max-width:90%;overflow:hidden}
.cvw{position:relative;width:calc(85.6mm*1.5);height:calc(54mm*1.5);max-width:100%;margin:8px auto}.cvw>div{position:absolute;right:0;top:0;transform:scale(1.5);transform-origin:top right}
@media(max-width:520px){.cvw{zoom:.7}}
#toast{z-index:120!important}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>

function sha256(s){const b=new TextEncoder().encode(s),l=b.length,n=((l+9+63)>>6)<<6,w=new Uint8Array(n);w.set(b);w[l]=128;const dv=new DataView(w.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));
  const K=[],H=[];let p=2,c=0;while(c<64){let pr=1;for(let i=2;i*i<=p;i++)if(p%i==0){pr=0;break}if(pr){if(c<8)H[c]=((Math.sqrt(p)%1)*4294967296)|0;K[c]=((Math.cbrt(p)%1)*4294967296)|0;c++}p++}
  const W=new Int32Array(64),R=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)W[i]=dv.getInt32(o+i*4);
    for(let i=16;i<64;i++){const a=W[i-15],d=W[i-2];W[i]=(W[i-16]+(R(a,7)^R(a,18)^(a>>>3))+W[i-7]+(R(d,17)^R(d,19)^(d>>>10)))|0}

function tog(kind,b){const ts=kind=='a'?local.getAudioTracks():local.getVideoTracks();if(!ts.length)return;const on=!ts[0].enabled;ts.forEach(t=>t.enabled=on);b.classList.toggle('off',!on)}

/* ===== اجتماع جماعي حتى 50 (LiveKit على خادم النادي) مع تتبع الحضور ===== */
const GM=(()=>{
let ov,room,t0,timer,tiles=new Map(),T={},reports=[],rn='',aud=false,msgs=0,sent=false,closing=false;
const q=k=>ov.querySelector('[k='+k+']'),enc=o=>new TextEncoder().encode(JSON.stringify(o)),wait=ms=>new Promise(z=>setTimeout(z,ms));
const adm=()=>AUTH&&AUTH.role==='admin',hm=t=>new Date(t).toTimeString().slice(0,5);
const ident=()=>adm()?'SRCPrime':((DB.members.find(x=>x.id===AUTH.id)||{}).no||'guest');
const loadLib=()=>new Promise((ok,no)=>{if(window.LivekitClient)return ok();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.min.js';s.onload=ok;s.onerror=()=>no(new Error('lib'));document.head.appendChild(s)});
function count(){q('cnt').textContent=(room?room.remoteParticipants.size+1:1)+' / 50'}
function mark(id,name,on){if(!adm()||id==='SRCPrime')return;const x=T[id]||(T[id]={name,first:Date.now(),ms:0,at:null});x.name=name||x.name;if(on){if(!x.at)x.at=Date.now()}else if(x.at){x.ms+=Date.now()-x.at;x.at=null}}
function tile(key,name,sc){let t=tiles.get(key);if(t)return t;t=document.createElement('div');t.className='gm-t'+(sc?' sc':'');
  t.innerHTML='<b class="gm-i"></b><span class="gm-n"></span>';t.children[0].textContent=sc?'🖥':(name||'?').trim().charAt(0);t.children[1].textContent=(sc?'شاشة ':'')+name;
  q('grid').appendChild(t);tiles.set(key,t);count();return t}
function drop(key){const t=tiles.get(key);if(t){t.remove();tiles.delete(key)}count()}
function addTrack(track,pub,p,local){
  const sc=pub.source==LivekitClient.Track.Source.ScreenShare,key=p.identity+(sc?'-s':'');
  if(track.kind=='video'){const t=tile(key,p.name||p.identity,sc),el=track.attach();if(local&&!sc)el.style.transform='scaleX(-1)';t.prepend(el)}
  else if(!local){tile(p.identity,p.name||p.identity).appendChild(track.attach())}}
function remTrack(track,pub,p){track.detach().forEach(e=>e.remove());if(pub.source==LivekitClient.Track.Source.ScreenShare)drop(p.identity+'-s')}
function addMsg(n,t,mine){const d=document.createElement('div');d.className='mt-m'+(mine?' me2':'');const s=document.createElement('small');s.textContent=n;d.append(s,document.createTextNode(t));q('msgs').appendChild(d);q('msgs').scrollTop=1e9;if(!mine&&q('chat').classList.contains('h'))toast(n+': '+t.slice(0,40))}
async function sendRep(){
  if(sent||!room||adm())return;sent=true;const m=DB.members.find(x=>x.id===AUTH.id)||{};
  const r={k:'rep',no:m.no,name:m.name,room:rn,join:hm(t0),leave:hm(Date.now()),min:Math.max(1,Math.round((Date.now()-t0)/60000)),msgs,audio:aud};
  try{await room.localParticipant.publishData(enc(r),{reliable:true,destinationIdentities:['SRCPrime']})}catch(e){}
  await wait(400)}
async function start(name,srv,pw,rn2,audio){
  const {Room,RoomEvent}=LivekitClient;
  let tok;try{const r=await fetch(srv+'/token?room='+encodeURIComponent(rn2)+'&name='+encodeURIComponent(name)+'&id='+encodeURIComponent(ident())+'&pw='+encodeURIComponent(pw));if(!r.ok)throw new Error(r.status==401?'كلمة السر غير صحيحة':'تعذّر الوصول للخادم');tok=await r.text()}
  catch(e){toast(e.message=='Failed to fetch'?'تعذّر الوصول للخادم، تحقق من العنوان':e.message);return close(true)}
  room=new Room({adaptiveStream:true,dynacast:true});
  room.on(RoomEvent.TrackSubscribed,(t,pub,p)=>addTrack(t,pub,p,false))
    .on(RoomEvent.TrackUnsubscribed,remTrack)
    .on(RoomEvent.LocalTrackPublished,(pub,lp)=>pub.track&&addTrack(pub.track,pub,lp,true))
    .on(RoomEvent.LocalTrackUnpublished,(pub,lp)=>pub.track&&remTrack(pub.track,pub,lp))
    .on(RoomEvent.ParticipantConnected,p=>{tile(p.identity,p.name||p.identity);mark(p.identity,p.name,true)})
    .on(RoomEvent.ParticipantDisconnected,p=>{drop(p.identity);drop(p.identity+'-s');mark(p.identity,p.name,false)})
